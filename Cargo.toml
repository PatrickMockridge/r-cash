[workspace]
resolver = "2"
members = [
  "crates/rcash-core",
  "crates/rcash-chain",
  "crates/rcash-sdk",
  "crates/rcash-cli",
  "crates/rcash-wasm",
]
# `rcash-wasm` is a wasm32-only artifact. Excluding it from the default members keeps
# `cargo build`/`cargo test` from trying to link it on the host; `-p rcash-wasm
# --target wasm32-unknown-unknown` still works.
default-members = [
  "crates/rcash-core",
  "crates/rcash-chain",
  "crates/rcash-sdk",
  "crates/rcash-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.95"
repository = "https://github.com/PatrickMockridge/r-cash"

[workspace.dependencies]
rcash-core = { path = "crates/rcash-core" }
rcash-chain = { path = "crates/rcash-chain" }
rcash-sdk = { path = "crates/rcash-sdk" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bs58 = "0.5"
zeroize = "1"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Keep the wasm-safe feature set here. `rt-multi-thread` is native-only and is enabled
# by the CLI crate, the only place that needs it.
tokio = { version = "1", features = ["macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
k256 = { version = "0.14", features = ["ecdsa", "arithmetic"] }
sha3 = "0.12"
prost = "0.14"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.4", features = ["wasm_js"] }

# Pinned to the rholo dev revision that includes the built-in Decimal removal (issue #527).
# The crates are AGPL-3.0-only; see THIRD_PARTY_NOTICES.md. Path dependencies cannot read an
# env var, so local hacking against ../rholo uses the documented `--config patch` invocation
# in book/src/guides/cli.md rather than a path in this file.
rchain-crypto = { git = "https://github.com/rhovision-org/rholo", rev = "841cb842876369deaa63e3b3e26c20d60e6c74c6", default-features = false }
rchain-shared = { git = "https://github.com/rhovision-org/rholo", rev = "841cb842876369deaa63e3b3e26c20d60e6c74c6", default-features = false }
