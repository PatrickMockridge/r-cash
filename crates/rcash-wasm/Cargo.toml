[package]
name = "rcash-wasm"
description = "WASM facade over the R-Cash SDK for the browser wallet and UI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Binaryen's wasm-opt is a C++ binary. The language policy forbids C/C++ build
# steps, so wasm-pack must not run it for release builds either.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
rcash-core.workspace = true
rcash-chain = { path = "../rcash-chain", default-features = false, features = ["wasm"] }
rcash-sdk = { path = "../rcash-sdk", default-features = false, features = ["wasm"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
serde.workspace = true
serde_json.workspace = true
js-sys = "0.3"
getrandom.workspace = true
zeroize.workspace = true
scrypt = "0.12"
aes = "0.9"
ctr = "0.10"
sha3.workspace = true

# No wasm-bindgen-test: it pulls minicov, whose build script compiles C. The wasm
# boundary is covered by web/tests/wasm-smoke.mjs; pure logic is tested on the host.
