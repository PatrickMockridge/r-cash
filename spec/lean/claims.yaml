      - {name: Rholphin.codec_injective, strength: substantive, kind: invariant}

  SER:
    statement: A committed deploy does not change a disjoint deploy's precondition or values.
    status: covered
    theorems:
      - {name: Rholphin.preOk_disjoint, strength: substantive, kind: law}
      - {name: Rholphin.commit_disjoint_does_not_block, strength: substantive, kind: law}
      - {name: Rholphin.apply_disjoint_values, strength: substantive, kind: law}

# Module-level arm coverage.  Every flow arm's `lean:` name belongs to one of
# these modules; a new module must be classified before the gate passes.
# `checked` means the module carries substantive claims; `model_only` means it
# is a pure helper/read surface with no invariant obligation of its own.
