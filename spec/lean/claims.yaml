      - {name: Rholphin.Model.Market.admit_fresh, strength: substantive, kind: preservation}
      - {name: Rholphin.Model.Market.admit_min_ticket, strength: substantive, kind: preservation}
      - {name: Rholphin.Model.Market.admit_max_trade, strength: substantive, kind: preservation}
  I13:
    statement: Seed lock is one-shot; terminal flags exclusive; beneficiary/governor gated.
    predicate: Rholphin.Model.Pool.Lock
    status: partial
    note: >-
