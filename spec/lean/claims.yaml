    statement: Single-cell commit; take/post exactly once with no await between.
    status: partial
    note: The generic balance and embedding are proved; the 171 arm instances are not yet generated.
    theorems:
      - {name: Rholphin.runPrim_cell, strength: substantive, kind: embedding}
      - {name: Rholphin.take_put_balance, strength: substantive, kind: law}
  P3:
    statement: Effect-then-commit; a failed revalidation aborts and leaves no post.
    status: partial
    note: fail_aborts proves the abort is quiescent; the revalidation guard is not yet modelled.
    theorems:
      - {name: Rholphin.fail_aborts, strength: substantive, kind: law}
  P6:
    statement: Fail-closed; a graceful refusal never follows a write.
    status: partial
    note: refuse_quiescent proves a refusal changes no state; the write-tracking antecedent is Phase 4.
    theorems:
      - {name: Rholphin.refuse_quiescent, strength: substantive, kind: law}
