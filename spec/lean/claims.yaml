# Machine-readable claim register for the Lean model.
#
# This file is the audit's coverage contract.  It records, for every invariant in
# docs/spec/20-INVARIANTS.md, the Lean predicate and preservation theorems that
# are supposed to carry it, the strength of each theorem, and every assumption
# the theorem is conditional on.  tools/check_claims.py enforces the register:
# every invariant must appear, every named theorem must resolve, and a theorem
# declared `substantive` must not be a hypothesis restatement.
#
# Status values:
#   covered   - a preservation theorem exists and is substantive
#   partial   - some obligation is proved, but a stated part is missing
#   deferred  - no theorem yet; the deferral names the phase and the reason
#   tool      - evidence is a static tool (check_captures/check_mesh/measure), not Lean
#
# Strength values: substantive | definitional | restatement | stub | alias
# Only `substantive` is counted as proof of an invariant.  `definitional` and
# `restatement` theorems may stay in the model but must not be cited as a proof.

schema: rcash.lean-claims/v1
review_date: 2026-11-04

assumptions:
  hash.collision_resistant:
    lean: Rholphin.Crypto.CollisionResistant
    status: interface
    note: >-
      Content addressing is conditional on the hash being collision-resistant.
      `Rholphin.Crypto.Hasher` is the interface; the deployed blake2b256 is not
      implemented, and `TermsPut` records the hypothesis on each theorem.
  sig.unforgeable:
    lean: Rholphin.Crypto.Unforgeable
    status: interface
    note: >-
      Deployer/sponsor authority is conditional on signature unforgeability.
      `Rholphin.Crypto.SigScheme` is the interface; the old
      `Model.Kernel.verifier_sigOk` identity remains only for compatibility.
  claim.binding:
    lean: Rholphin.Crypto.Binding
    status: interface
    note: >-
      Claim-secret authority is conditional on the claim hash being binding.
      `Rholphin.Crypto.ClaimScheme` is the interface; the old
      `Model.Kernel.claimCode_hash` identity remains only for compatibility.
  codec.canonical_injective:
    lean: Rholphin.Crypto.Canonical
    status: interface
    note: >-
      The length-prefixed encoding is assumed injective.  `Rholphin.Crypto.Canonical`
      states it; the model's `codec_hash` is not the deployed blake2b256.
  ertp.native_total:
    lean: Rholphin.Linear.NativeTotal
    status: interface
    note: >-
      P4 and I10/I15 assume a native purse/issuer step that conserves total
      value or fails.  ERTP itself is not modelled.
  arithmetic.no_overflow:
    lean: Rholphin.NoOverflow
    status: assumed
    note: >-
      Lean Nat/Int are unbounded; the deploy's fixed-width arithmetic and
      truncation are not modelled.  Every arithmetic theorem is conditional
      on this.
  scheduler.fairness:
    lean: Rholphin.Fairness
    status: out_of_scope
    note: No liveness or fairness claim is made; the concurrency model is safety-only.
  phlo.gas:
    lean: Rholphin.Phlo
    status: out_of_scope
    note: Phlo, gas and the node scheduler are not modelled.

invariants:
  I1:
    statement: Quiescent linearity; one Full in every cell.
    predicate: Rholphin.Linear.WF
    status: covered
    note: >-
      WF constrains a finite trace to finish with nothing held; the interleaving
      layer proves linearity and the held-take blocking law.  The 171 arm
      instances are not yet generated (Phase 6).
    theorems:
      - name: Rholphin.wf_quiescent
        strength: definitional
        kind: preservation
      - name: Rholphin.take_then_put_wf
        strength: substantive
        kind: preservation
      - name: Rholphin.wf_compose
        strength: substantive
        kind: composition
      - name: Rholphin.take_without_put_not_wf
        strength: substantive
        kind: rejection
      - name: Rholphin.step_preserves_linear
        strength: substantive
        kind: preservation
      - name: Rholphin.steps_preserve_linear
        strength: substantive
        kind: preservation
      - name: Rholphin.held_take_unavailable
        strength: substantive
        kind: rejection
  I2:
    statement: Currency code unique; registry resolution matches the listing.
    predicate: Rholphin.Model.Registry.lookup
    status: partial
    note: Registration is proved; the live attestation/capability half is not.
    theorems:
      - name: Rholphin.Model.Registry.register_lookup
        strength: substantive
        kind: preservation
      - name: Rholphin.Model.Registry.root_register_resolves
        strength: substantive
        kind: preservation
      - name: Rholphin.Model.Registry.currencyRegistry_register_resolves
        strength: substantive
        kind: preservation
  I3:
    statement: One active-or-paused market per unordered pair; both orientations resolve.
    predicate: Rholphin.Model.Market.Index
    status: partial
    note: >-
      Staging writes both orientations and refuses an active prior; pair
      uniqueness at activation and reverse-stage refusal are not proved.
      Phase 5 replaces the Cantor Nat key with PairKey.
    theorems:
      - name: Rholphin.Model.Market.staged_is_draft
        strength: substantive
        kind: preservation
      - name: Rholphin.Model.Market.stage_writes_both
        strength: substantive
        kind: preservation
      - name: Rholphin.Model.Market.stage_refuses_active
        strength: substantive
        kind: rejection
  I4:
    statement: Legal market transitions; delisted is terminal.
    predicate: Rholphin.Model.Market.legal
    status: partial
    note: Delisted terminality is proved; the draft-abandon and version monotonicity halves are not.
    theorems:
      - name: Rholphin.Model.Market.delisted_terminal
        strength: definitional
        kind: invariant
      - name: Rholphin.Model.Market.delisted_accepts_nothing
        strength: substantive
        kind: rejection
  I5:
    statement: Terms integrity; termsHash = H(schema, values).
    predicate: Rholphin.CollisionResistant
    status: partial
    note: >-
      TermsPut accepts a hash only if it equals the computed hash, under the
      CollisionResistant hypothesis.  The flow arm is not yet generated against
      this function (Phase 6).
    theorems:
      - {name: Rholphin.terms_put_integrity, strength: substantive, kind: preservation}
      - {name: Rholphin.terms_put_rejects_mismatch, strength: substantive, kind: rejection}
      - {name: Rholphin.hash_distinct, strength: substantive, kind: invariant}
      - {name: Rholphin.Model.Market.marketTerms_putChecked_integrity, strength: substantive, kind: preservation}
      - {name: Rholphin.Model.Market.marketTerms_putChecked_refuses_bad_sponsor, strength: substantive, kind: rejection}
  I6:
    statement: Market URI slots are factory-created and sealed before activation.
    predicate: Rholphin.Model.Market.DirectoryWellFormed
    status: partial
    note: >-
      bind and seal preserve slot well-formedness.  Factory ownership is a
      capability in the deploy, not a modelled predicate.
    theorems:
      - {name: Rholphin.Model.Market.bind_preserves_directory, strength: substantive, kind: preservation}
      - {name: Rholphin.Model.Market.seal_preserves_directory, strength: substantive, kind: preservation}
  I7:
