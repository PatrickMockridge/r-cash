      - {name: Rholphin.Model.Pool.fund_refuses_funded, strength: substantive, kind: rejection}
      - {name: Rholphin.Model.Pool.release_then_cancel_refused, strength: substantive, kind: rejection}
      - {name: Rholphin.Model.Pool.cancel_then_release_refused, strength: substantive, kind: rejection}
  I14:
    statement: Transfer status changes at most once; claim xor refund.
    predicate: Rholphin.Model.Transfer.Transfer
    status: covered
    theorems:
      - name: Rholphin.Model.Transfer.claim_then_refund_refused
        strength: substantive
        kind: preservation
      - name: Rholphin.Model.Transfer.refund_then_claim_refused
        strength: substantive
        kind: preservation
  I15:
    statement: No payment is stranded on a refusal.
    predicate: Rholphin.Linear.NoStranded
    status: partial
    note: >-
      A rejected deploy has no state effect, and a refusal leaves the store and
      held set unchanged.  The native payment side is the ertp.native_total
