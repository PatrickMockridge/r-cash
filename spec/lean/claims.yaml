    Rholphin.Model.Market: {status: checked, note: I3/I4/I6/I12}
    Rholphin.Model.Pool: {status: checked, note: I10/I11/I13}
    Rholphin.Model.Governance: {status: checked, note: I19/S12}
    Rholphin.Model.Oracle: {status: checked, note: I7/I8/I9}
