    guards:
    - {id: active, expr: market active, refusal: {reason: not active, phase: pre}}
    - {id: fresh, expr: fresh and rate > 0, refusal: {reason: stale feed, phase: pre}}
    - {id: asset, expr: payment brand = input asset, refusal: {reason: not this asset, phase: pre}}
