    refusals:
    - {reason: minimum, phase: pre, reposts: false, fail: false}
    - {reason: not an LP payment, phase: pre, reposts: false, fail: false}
    - {reason: shares, phase: pre, reposts: false, fail: false}
    invariants:
    - I10
    - I11
    status: verified
    from: Seeded
    to: Empty
    acceptance:
    - AC-SPEC-POOL-01.1
