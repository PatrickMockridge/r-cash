  - arm: FxPool@"addLiquidity"
    transition: pool.FxPool.addLiquidity
    lean: Rholphin.Model.Pool.fxPool_addLiquidity
    kind: mutate
    source: {file: contracts/src/deploy/v3/51_pool.rho, line: 413}
    guards:
    - {id: active, expr: market draft or active, refusal: {reason: not active, phase: pre}}
    - {id: fresh, expr: fresh and rate > 0, refusal: {reason: stale feed, phase: pre}}
    - {id: assets, expr: payments are base and quote, refusal: {reason: not base, phase: pre}}
    - {id: first_balance, expr: first deposit within tolerance, refusal: {reason: first deposit balance, phase: pre}}
    - {id: min_liquidity, expr: depositValue >= minLiquidity, refusal: {reason: min liquidity, phase: pre}}
    - {id: shares, expr: sharesOut > 0 and sharesOut >= minShares, refusal: {reason: shares, phase: pre}}
    - {id: effect, expr: deposits and LP mint ok, refusal: {reason: payment, phase: pre}}
    effects:
    - {target: rb, formula: rb + baseAmt}
    - {target: rq, formula: rq + quoteAmt}
    - {target: totalShares, formula: totalShares + sharesOut}
    - {target: seeded, formula: 'true'}
    - {target: sharesOut, formula: 'if first: value(rb + b, rq + q, rate) - 1e8; else: floor((value(rb + b, rq + q) - value(rb, rq))
        * totalShares / value(rb, rq))'}
    access:
    - {cell: poolState, mode: consume, actor: arm, phase: commit}
    - {cell: poolState, mode: post, actor: arm, phase: commit}
    - {cell: poolState, mode: post, actor: 'helper:commitLiquidity', phase: commit}
    nested_calls:
    - {callee: commitLiquidity, protocol: H2a, takes: [], puts: [poolState], post_owner: helper}
    - {callee: poolOpen, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: poolRate, protocol: P0, takes: [], puts: [], post_owner: helper}
    refusals:
    - {reason: first deposit balance, phase: pre, reposts: false, fail: false}
    - {reason: min liquidity, phase: pre, reposts: false, fail: false}
    - {reason: not active, phase: pre, reposts: false, fail: false}
    - {reason: not base, phase: pre, reposts: false, fail: false}
    - {reason: not quote, phase: pre, reposts: false, fail: false}
    - {reason: shares, phase: pre, reposts: false, fail: false}
    - {reason: stale feed, phase: pre, reposts: false, fail: false}
    invariants:
    - I10
    - I11
    - I12
    status: verified
    to: Seeded
    acceptance:
