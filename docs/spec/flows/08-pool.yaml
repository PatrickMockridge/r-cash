  - arm: FxPool@"removeLiquidity"
    transition: pool.FxPool.removeLiquidity
    lean: Rholphin.Model.Pool.fxPool_removeLiquidity
    kind: mutate
    source: {file: contracts/src/deploy/v3/51_pool.rho, line: 457}
