# Flow specification.
# Arm keys, source lines, access modes and refusal sets are checked against
# contracts/build/arm_inventory.json by tools/check_flows.py. Guards, effects,
# acceptance IDs, model/vector and invariants are the authored content; status is
# not a synonym for tested. See README.md for the schema and protocol labels.

schema: rcash.flows/v1
subsystem: pool
source_globs:
- contracts/src/deploy/v3/51_pool.rho
invariants: {}
defects:
- {id: L1, subject: LiquidityLock@"fund", defect: does not enforce untilHeight >= now + lockMinBlocks and never reads the clock, fix: read
    poolNow; refuse lock too short; repost lockState, status: fixed}
components:
- name: PoolTemplate
  lean_module: Rholphin.Model.Pool
  arms:
  - arm: PoolTemplate@"create"
    transition: pool.PoolTemplate.create
    lean: Rholphin.Model.Pool.poolTemplate_create
    kind: mutate
    source: {file: contracts/src/deploy/v3/51_pool.rho, line: 674}
    guards:
    - {id: terms, expr: termsHash = H(terms), refusal: {reason: terms fields, phase: pre}}
    - {id: base, expr: AssetResolver.issuer(base) ok, refusal: {reason: not base, phase: pre}}
    - {id: quote, expr: AssetResolver.issuer(quote) ok, refusal: {reason: not quote, phase: pre}}
    effects:
    - {target: pool, formula: '{rb: 0, rq: 0, totalShares: 0, seeded: false}'}
    - {target: lock, formula: '{funded: false, released: false, cancelled: false, untilHeight: 0, shares: 0}'}
    - {target: reply, formula: '(true, poolUri, lockUri)'}
    access:
    - {cell: lockState, mode: post, actor: 'helper:assemblePool', phase: commit}
    - {cell: poolState, mode: post, actor: 'helper:assemblePool', phase: commit}
    nested_calls:
    - {callee: assemblePool, protocol: P3, takes: [], puts: [lockState, poolState], post_owner: helper, creates: [lockState, poolState]}
    refusals: []
    invariants:
    - I10
    - I11
    - I13
    status: verified
    acceptance:
    - AC-SPEC-POOL-01.1
  states:
  - Live
  initial: Live
