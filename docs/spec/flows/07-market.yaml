    source: {file: contracts/src/deploy/v3/50_market.rho, line: 105}
    guards:
    - {id: bounds, expr: 'Bounds.checkTerms(terms, values)', refusal: {reason: terms fields, phase: pre}}
    - {id: canonical, expr: 'hash = Codec.canonical(rcash:market-terms:v4, values)', refusal: {reason: terms fields, phase: pre}}
    effects:
    - {target: 'terms[hash]', formula: '{terms: terms, values: values}'}
    - {target: rev, formula: rev + 1}
    - {target: reply, formula: '(true, hash)'}
    access:
    - {cell: termsState, mode: consume, actor: arm, phase: commit}
    - {cell: termsState, mode: post, actor: arm, phase: commit}
    nested_calls: []
    refusals: []
    invariants:
