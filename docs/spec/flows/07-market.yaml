    - {reason: lock height, phase: pre, reposts: false, fail: false}
    - {reason: lock unfunded, phase: pre, reposts: false, fail: false}
    - {reason: no attestation, phase: pre, reposts: false, fail: false}
    - {reason: no lock, phase: pre, reposts: false, fail: false}
    - {reason: no market, phase: pre, reposts: false, fail: false}
    - {reason: not draft, phase: pre, reposts: false, fail: false}
    - {reason: not sealed, phase: pre, reposts: false, fail: false}
    - {reason: not seeded, phase: pre, reposts: false, fail: false}
    - {reason: seed mismatch, phase: pre, reposts: false, fail: false}
    - {reason: shares mismatch, phase: pre, reposts: false, fail: false}
    - {reason: terms mismatch, phase: pre, reposts: false, fail: false}
