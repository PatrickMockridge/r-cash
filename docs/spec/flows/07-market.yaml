    - {id: sealed, expr: 'directory.slots[marketId].sealed', refusal: {reason: not sealed, phase: pre}}
    - {id: terms, expr: 'terms[termsHash] exists', refusal: {reason: no terms, phase: pre}}
    - {id: lock, expr: lock.funded, refusal: {reason: lock unfunded, phase: pre}}
    - {id: lock_height, expr: lock.untilHeight >= terms.lockUntilHeight, refusal: {reason: lock height, phase: pre}}
    - {id: seed, expr: pool.seeded and rb >= seedBase and rq >= seedQuote, refusal: {reason: seed mismatch, phase: pre}}
    - {id: shares, expr: totalShares >= seedInitialShares, refusal: {reason: shares mismatch, phase: pre}}
    - {id: terms_hash, expr: pool.termsHash = record.termsHash, refusal: {reason: terms mismatch, phase: pre}}
    - {id: depth, expr: rq >= depthFloorQuote, refusal: {reason: depth, phase: pre}}
    effects:
    - {target: 'markets[marketId].status', formula: active}
    - {target: rev, formula: rev + 1}
    access:
    - {cell: indexState, mode: peek, actor: arm, phase: pre}
    - {cell: indexState, mode: consume, actor: 'helper:activatePool', phase: commit}
    - {cell: indexState, mode: post, actor: 'helper:activatePool', phase: commit}
    nested_calls:
