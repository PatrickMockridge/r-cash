- name: MarketFactory
  lean_module: Rholphin.Model.Market
  arms:
  - arm: MarketFactory@"createMarket"
    transition: market.MarketFactory.createMarket
    lean: Rholphin.Model.Market.marketFactory_createMarket
    kind: mutate
    source: {file: contracts/src/deploy/v3/50_market.rho, line: 564}
    guards:
    - {id: terms, expr: 'MarketTerms.put(terms, values) = (true, termsHash)', refusal: {reason: terms fields, phase: pre}}
    - {id: sponsor_sig, expr: 'Verifier.sigOk(H(rcash:market-create:v1|marketId|termsHash|sponsor), sig)', refusal: {reason: bad sponsor
          signature, phase: pre}}
    - {id: sponsor, expr: terms.sponsorPubKey = sponsorHex, refusal: {reason: sponsor mismatch, phase: pre}}
    - {id: owner, expr: 'marketOwnerCheck(terms, sponsorHex)', refusal: {reason: lock beneficiary, phase: pre}}
    - {id: base_feed, expr: base feed policy matches and active, refusal: {reason: base feed policy, phase: pre}}
    - {id: quote_feed, expr: quote feed policy matches and active, refusal: {reason: quote feed policy, phase: pre}}
    - {id: pool, expr: PoolTemplate.create ok, refusal: {reason: no attestation, phase: pre}}
    - {id: bind, expr: MarketDirectory.bind ok, refusal: {reason: sealed, phase: pre}}
    - {id: seal, expr: MarketDirectory.seal ok, refusal: {reason: no slot, phase: pre}}
    - {id: stage, expr: MarketIndex.stage ok, refusal: {reason: exists, phase: pre}}
    effects:
    - {target: 'terms[termsHash]', formula: '{terms, values}'}
    - {target: 'directory.slots[marketId]', formula: '{poolUri, lockUri, termsHash, sealed}'}
    - {target: 'markets[marketId]', formula: '{marketId, slug, pairKey, base, quote, version, termsHash, status: draft}'}
    - {target: reply, formula: '(true, marketId, poolUri, lockUri, termsHash)'}
    access: []
    nested_calls:
    - {callee: marketVerifier, protocol: P0, internal: true, takes: [], puts: [], post_owner: helper}
    - {callee: marketOwnerCheck, protocol: P0, internal: true, takes: [], puts: [], post_owner: helper}
    - {callee: marketOracle, protocol: P0, internal: true, takes: [], puts: [], post_owner: helper}
    - {callee: MarketTerms@"put", protocol: P4, internal: true}
    - {callee: PoolTemplate@"create", protocol: P4, internal: true}
    - {callee: MarketDirectory@"bind", protocol: P4, internal: true}
    - {callee: MarketDirectory@"seal", protocol: P4, internal: true}
    - {callee: MarketIndex@"stage", protocol: P4, internal: true}
    refusals:
    - {reason: bad sponsor signature, phase: pre, reposts: false, fail: false}
    - {reason: base feed policy, phase: pre, reposts: false, fail: false}
    - {reason: feed inactive, phase: pre, reposts: false, fail: false}
    - {reason: lock beneficiary, phase: pre, reposts: false, fail: false}
    - {reason: lock too short, phase: pre, reposts: false, fail: false}
    - {reason: quote feed policy, phase: pre, reposts: false, fail: false}
    - {reason: sponsor mismatch, phase: pre, reposts: false, fail: false}
    - {reason: sponsor owner, phase: pre, reposts: false, fail: false}
    invariants:
    - I3
    - I5
    - I6
    status: verified
  states:
  - Live
  initial: Live
