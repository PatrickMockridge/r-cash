    - {id: pair, expr: 'byPair[pairKey] absent or prior delisted and version > prior.version', refusal: {reason: pair active, phase: pre}}
    - {id: version, expr: version > prior.version, refusal: {reason: version, phase: pre}}
    effects:
    - {target: 'markets[marketId]', formula: record}
    - {target: 'byPair[pairKey]', formula: marketId}
    - {target: 'bySlug[slug]', formula: marketId}
    - {target: rev, formula: rev + 1}
    access:
    - {cell: indexState, mode: consume, actor: arm, phase: commit}
    - {cell: indexState, mode: post, actor: arm, phase: commit}
    - {cell: indexState, mode: post, actor: 'helper:stagePairCheck', phase: commit}
    nested_calls:
    - {callee: stagePairCheck, protocol: H2a, takes: [], puts: [indexState], post_owner: helper}
    refusals:
    - {reason: bad index authority, phase: pre, reposts: false, fail: false}
    - {reason: exists, phase: pre, reposts: false, fail: false}
    - {reason: pair active, phase: pre, reposts: false, fail: false}
    - {reason: slug, phase: pre, reposts: false, fail: false}
    - {reason: version, phase: pre, reposts: false, fail: false}
    invariants:
