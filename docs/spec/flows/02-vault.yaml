# Flow specification.
# Arm keys, source lines, access modes and refusal sets are checked against
# contracts/build/arm_inventory.json by tools/check_flows.py. Guards, effects,
# acceptance IDs, model/vector and invariants are the authored content; status is
# not a synonym for tested. See README.md for the schema and protocol labels.
#
# T2 transition: 31_vault.rho is the vault term. The monolith still carries the
# same VaultBook/LiquidationEngine arms on this branch, so the inventory reports
# duplicate arm keys until the integrator deletes 31_stablecoin.rho. The source
# globs below intentionally list both files; arm-level checks resolve against
# 31_vault.rho (last file wins in the inventory).

schema: rcash.flows/v1
subsystem: vault
source_globs:
- contracts/src/deploy/v3/31_stablecoin.rho
- contracts/src/deploy/v3/31_vault.rho
invariants: {}
defects:
- {id: D2.1, subject: VaultBook@"mint" via vaultMintCommit, defect: 'takes vaultState and returns (false, recapitalise) without reposting',
  fix: the mint halt is validated on a buffer read before the effect; no vaultState take is live', status: fixed}
components:
- name: VaultBook
  lean_module: Rholphin.Model.Vault
  arms:
  - arm: VaultBook@"rotate"
    transition: vault.VaultBook.rotate
    lean: Rholphin.Model.Vault.vaultBook_rotate
    kind: mutate
    source: {file: contracts/src/deploy/v3/31_vault.rho, line: 477}
    guards:
    - {id: vault, expr: vault exists, refusal: {reason: no vault, phase: pre}}
    - {id: auth, expr: 'vaults[ownerId].auth = auth', refusal: {reason: bad vault auth, phase: pre}}
    effects:
    - {target: 'vaults[ownerId].auth', formula: newAuth}
    access:
    - {cell: vaultState, mode: consume, actor: arm, phase: commit}
    - {cell: vaultState, mode: post, actor: arm, phase: commit}
    nested_calls: []
    refusals:
    - {reason: no vault, phase: pre, reposts: false, fail: false}
    - {reason: bad vault auth, phase: pre, reposts: false, fail: false}
    invariants:
    - I21
    status: verified
    acceptance:
    - AC-SPEC-ISS-01.1
  - arm: VaultBook@"open"
    transition: vault.VaultBook.open
    lean: Rholphin.Model.Vault.vaultBook_open
    kind: mutate
    source: {file: contracts/src/deploy/v3/31_vault.rho, line: 495}
    guards:
    - {id: proof, expr: 'AccountFactory.verify(ownerId, proof)', refusal: {reason: verify failed, phase: pre}}
    effects:
    - {target: 'vaults[ownerId]', formula: '{auth: fresh, collateral: 0, debt: 0, lastHeight: now}'}
    - {target: reply, formula: '(true, auth)'}
    access:
    - {cell: vaultState, mode: peek, actor: arm, phase: pre}
    - {cell: vaultState, mode: consume, actor: arm, phase: commit}
    - {cell: vaultState, mode: post, actor: arm, phase: commit}
    nested_calls:
    - {callee: vaultResolve, protocol: P0, takes: [], puts: [], post_owner: helper}
    refusals:
    - {reason: not owner, phase: pre, reposts: false, fail: false}
    - {reason: verify failed, phase: pre, reposts: false, fail: false}
    invariants: []
    status: verified
    to: Open
    acceptance:
    - AC-SPEC-ISS-01.1
  - arm: VaultBook@"deposit"
    transition: vault.VaultBook.deposit
    lean: Rholphin.Model.Vault.vaultBook_deposit
    kind: mutate
    source: {file: contracts/src/deploy/v3/31_vault.rho, line: 547}
    guards:
    - {id: slot, expr: 'provisionedState.custody = true', refusal: {reason: no slot, phase: pre}}
    - {id: exists, expr: 'vaults[ownerId] != Nil', refusal: {reason: no vault, phase: pre}}
    - {id: auth, expr: 'vaults[ownerId].auth = auth', refusal: {reason: bad vault auth, phase: pre}}
    effects:
    - {target: 'vaults[ownerId].collateral', formula: c + amount}
    - {target: 'vaults[ownerId].debt', formula: 'accrue(d, lastHeight, now, ratePerBlock)'}
    - {target: 'vaults[ownerId].lastHeight', formula: now}
    - {target: totalCollateral, formula: totalCollateral + amount}
    - {target: totalDebt, formula: totalDebt + (accrued - d)}
    - {target: totalAccruedInterest, formula: totalAccruedInterest + (accrued - d)}
    - {target: vaults.rev, formula: rev + 1}
    access:
    - {cell: provisionedState, mode: peek, actor: arm, phase: pre}
    - {cell: vaultState, mode: peek, actor: arm, phase: pre}
    - {cell: vaultState, mode: consume, actor: 'helper:vaultCommit', phase: commit}
    - {cell: vaultState, mode: post, actor: 'helper:vaultCommit', phase: commit}
    nested_calls:
    - {callee: vaultParams, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultResolve, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultAccrue, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultCommit, protocol: H2b, takes: [vaultState], puts: [vaultState], post_owner: helper}
    refusals:
    - {reason: bad vault auth, phase: pre, reposts: false, fail: false}
    - {reason: no slot, phase: pre, reposts: false, fail: false}
    - {reason: no vault, phase: pre, reposts: false, fail: false}
    invariants:
    - S2
    - S3
    - S4
    status: verified
    acceptance:
    - AC-SPEC-ISS-01.1
    model: vault.deposit
  - arm: VaultBook@"mint"
    transition: vault.VaultBook.mint
    lean: Rholphin.Model.Vault.vaultBook_mint
    kind: mutate
    source: {file: contracts/src/deploy/v3/31_vault.rho, line: 613}
    guards:
    - {id: amount_pos, expr: amount > 0, refusal: {reason: amount, phase: pre}}
    - {id: slot, expr: 'provisionedState.mint = true', refusal: {reason: no slot, phase: pre}}
    - {id: not_paused, expr: not paused, refusal: {reason: paused, phase: pre}}
    - {id: exists, expr: 'vaults[ownerId] != Nil', refusal: {reason: no vault, phase: pre}}
    - {id: auth, expr: 'vaults[ownerId].auth = auth', refusal: {reason: bad vault auth, phase: pre}}
    - {id: fresh_feed, expr: fresh, refusal: {reason: stale feed, phase: pre}}
    - {id: rate_pos, expr: rate > 0, refusal: {reason: no rate, phase: pre}}
    - {id: min_debt, expr: accrued + amount >= minDebt, refusal: {reason: min debt, phase: pre}}
    - {id: max_debt, expr: accrued + amount <= maxDebt, refusal: {reason: max debt, phase: pre}}
    - {id: ceiling, expr: totalDebt + (accrued - d) + amount <= debtCeiling, refusal: {reason: ceiling, phase: pre}}
    - {id: health, expr: 'health(c, accrued + amount, rate, mcrBps)', refusal: {reason: below MCR, phase: pre}}
    - {id: solvency, expr: not (sin > surplus), refusal: {reason: recapitalise, phase: pre}}
    effects:
    - {target: 'vaults[ownerId].debt', formula: accrued + amount}
    - {target: 'vaults[ownerId].lastHeight', formula: now}
    - {target: totalDebt, formula: totalDebt + (accrued - d) + amount}
    - {target: totalAccruedInterest, formula: totalAccruedInterest + (accrued - d)}
    - {target: supply, formula: totalPrincipal + amount}
    - {target: vaults.rev, formula: rev + 1}
    access:
    - {cell: provisionedState, mode: peek, actor: arm, phase: pre}
    - {cell: vaultState, mode: peek, actor: arm, phase: pre}
    - {cell: vaultState, mode: consume, actor: 'helper:vaultMintCommit', phase: commit}
    - {cell: vaultState, mode: post, actor: 'helper:vaultMintCommit', phase: commit}
    nested_calls:
    - {callee: vaultParams, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultResolve, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultRate, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultAccrue, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultHealth, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultMintCommit, protocol: H2b, takes: [vaultState], puts: [vaultState], post_owner: helper}
    refusals:
    - {reason: amount, phase: pre, reposts: false, fail: false}
    - {reason: bad vault auth, phase: pre, reposts: false, fail: false}
    - {reason: below MCR, phase: pre, reposts: false, fail: false}
    - {reason: ceiling, phase: pre, reposts: false, fail: false}
    - {reason: max debt, phase: pre, reposts: false, fail: false}
    - {reason: min debt, phase: pre, reposts: false, fail: false}
    - {reason: no rate, phase: pre, reposts: false, fail: false}
    - {reason: no slot, phase: pre, reposts: false, fail: false}
    - {reason: no vault, phase: pre, reposts: false, fail: false}
    - {reason: paused, phase: pre, reposts: false, fail: false}
    - {reason: recapitalise, phase: pre, reposts: false, fail: false}
    - {reason: stale feed, phase: pre, reposts: false, fail: false}
    invariants:
    - S1
    - S2
    - S3
    - S4
    - S9
    status: verified
    acceptance:
    - AC-SPEC-ISS-01.1
  - arm: VaultBook@"withdraw"
    transition: vault.VaultBook.withdraw
    lean: Rholphin.Model.Vault.vaultBook_withdraw
    kind: mutate
    source: {file: contracts/src/deploy/v3/31_vault.rho, line: 692}
    guards:
    - {id: amount_pos, expr: amount > 0, refusal: {reason: amount, phase: pre}}
    - {id: slot, expr: 'provisionedState.custody = true', refusal: {reason: no slot, phase: pre}}
    - {id: exists, expr: 'vaults[ownerId] != Nil', refusal: {reason: no vault, phase: pre}}
    - {id: not_paused, expr: not paused, refusal: {reason: paused, phase: pre}}
    - {id: auth, expr: 'vaults[ownerId].auth = auth', refusal: {reason: bad vault auth, phase: pre}}
    - {id: collateral_floor, expr: c >= amount, refusal: {reason: amount, phase: pre}}
    - {id: fresh_feed, expr: fresh, refusal: {reason: stale feed, phase: pre}}
    - {id: rate_pos, expr: rate > 0, refusal: {reason: no rate, phase: pre}}
    - {id: health, expr: 'health(c - amount, accrued, rate, mcrBps)', refusal: {reason: below MCR, phase: pre}}
    effects:
    - {target: 'vaults[ownerId].collateral', formula: c - amount}
    - {target: 'vaults[ownerId].debt', formula: accrued}
    - {target: 'vaults[ownerId].lastHeight', formula: now}
    - {target: totalCollateral, formula: totalCollateral - amount}
    - {target: totalDebt, formula: totalDebt + (accrued - d)}
    - {target: totalAccruedInterest, formula: totalAccruedInterest + (accrued - d)}
    - {target: custody.rev, formula: custody.rev - amount}
    - {target: vaults.rev, formula: rev + 1}
    access:
    - {cell: provisionedState, mode: peek, actor: arm, phase: pre}
    - {cell: vaultState, mode: peek, actor: arm, phase: pre}
    - {cell: vaultState, mode: consume, actor: 'helper:vaultCommit', phase: commit}
    - {cell: vaultState, mode: post, actor: 'helper:vaultCommit', phase: commit}
    nested_calls:
    - {callee: vaultParams, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultResolve, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultRate, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultAccrue, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultHealth, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultCommit, protocol: H2b, takes: [vaultState], puts: [vaultState], post_owner: helper}
    refusals:
    - {reason: amount, phase: pre, reposts: false, fail: false}
    - {reason: bad vault auth, phase: pre, reposts: false, fail: false}
    - {reason: below MCR, phase: pre, reposts: false, fail: false}
    - {reason: no rate, phase: pre, reposts: false, fail: false}
    - {reason: no slot, phase: pre, reposts: false, fail: false}
    - {reason: no vault, phase: pre, reposts: false, fail: false}
    - {reason: paused, phase: pre, reposts: false, fail: false}
    - {reason: stale feed, phase: pre, reposts: false, fail: false}
    invariants:
    - S2
    - S3
    - S4
    - S7
    status: verified
    acceptance:
    - AC-SPEC-ISS-01.1
    model: vault.withdraw
  - arm: VaultBook@"repay"
    transition: vault.VaultBook.repay
    lean: Rholphin.Model.Vault.vaultBook_repay
    kind: mutate
    source: {file: contracts/src/deploy/v3/31_vault.rho, line: 785}
    guards:
    - {id: slots, expr: 'provisionedState.settle = true and provisionedState.buffer = true', refusal: {reason: no slot, phase: pre}}
    - {id: exists, expr: 'vaults[ownerId] != Nil', refusal: {reason: no vault, phase: pre}}
    - {id: auth, expr: 'vaults[ownerId].auth = auth', refusal: {reason: bad vault auth, phase: pre}}
    - {id: amount_pos, expr: amount > 0, refusal: {reason: amount, phase: pre}}
    - {id: amount_le_debt, expr: amount <= accrued, refusal: {reason: amount, phase: pre}}
    - {id: min_debt_residual, expr: accrued - amount = 0 or accrued - amount >= minDebt, refusal: {reason: min debt, phase: pre}}
    - {id: payment_asset, expr: 'Stablecoin.amountOf(payment)', refusal: {reason: asset, phase: pre}}
    effects:
    - {target: interestPaid, formula: 'min(amount, accrued - d)'}
    - {target: principalPaid, formula: amount - interestPaid}
    - {target: cancelled, formula: 'min(surplus, sin)'}
    - {target: move, formula: floor((surplus - cancelled) * savingsShareBps / 10000)}
    - {target: 'vaults[ownerId].debt', formula: accrued - amount}
    - {target: 'vaults[ownerId].lastHeight', formula: now}
    - {target: totalDebt, formula: totalDebt + (accrued - d) - amount}
    - {target: totalAccruedInterest, formula: totalAccruedInterest + (accrued - d) - interestPaid}
    - {target: supply, formula: supply - principalPaid - cancelled}
    - {target: sin, formula: sin - cancelled}
    - {target: surplus, formula: surplus - cancelled - move}
    - {target: vaults.rev, formula: rev + 1}
    access:
    - {cell: provisionedState, mode: peek, actor: arm, phase: pre}
    - {cell: vaultState, mode: peek, actor: arm, phase: pre}
    - {cell: vaultState, mode: consume, actor: 'helper:repayCommit', phase: commit}
    - {cell: vaultState, mode: post, actor: 'helper:repayCommit', phase: commit}
    nested_calls:
    - {callee: vaultParams, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultResolve, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultAccrue, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: repayCommit, protocol: H2b, takes: [vaultState], puts: [vaultState], post_owner: helper}
    # T3 effects the waterfall drives; cross_term marks a write outside this
    # term's cells. The paySavings write is modelled here, not as a direct effect.
    - {callee: 'BufferOperatorFacet@"deposit"', protocol: P6, cross_term: true}
    - {callee: 'BufferOperatorFacet@"cover"', protocol: P6, cross_term: true}
    - {callee: 'BufferOperatorFacet@"paySavings"', protocol: P6, cross_term: true}
    refusals:
    - {reason: amount, phase: pre, reposts: false, fail: false}
    - {reason: asset, phase: pre, reposts: false, fail: false}
    - {reason: bad vault auth, phase: pre, reposts: false, fail: false}
    - {reason: min debt, phase: pre, reposts: false, fail: false}
    - {reason: no slot, phase: pre, reposts: false, fail: false}
    - {reason: no vault, phase: pre, reposts: false, fail: false}
    invariants:
    - S3
    - S7
    - S9
    - S10
    status: verified
    acceptance:
    - AC-SPEC-ISS-01.1
    model: issuer.repay
    vector: ledger.repay
  - arm: VaultBook@"liquidate"
    transition: vault.VaultBook.liquidate
    lean: Rholphin.Model.Vault.vaultBook_liquidate
    kind: mutate
    source: {file: contracts/src/deploy/v3/31_vault.rho, line: 862}
    guards:
    - {id: auth_liquidation, expr: auth = liquidationAuthState, refusal: {reason: bad liquidation authority, phase: pre}}
    - {id: payment_asset, expr: 'Stablecoin.amountOf(payment)', refusal: {reason: not a stablecoin payment, phase: pre}}
    - {id: amount_pos, expr: amount > 0, refusal: {reason: amount, phase: pre}}
    - {id: slots, expr: 'provisionedState.burn = true and provisionedState.custody = true and provisionedState.buffer = true', refusal: {reason: no slot, phase: pre}}
    - {id: exists, expr: 'vaults[ownerId] != Nil', refusal: {reason: no vault, phase: pre}}
    - {id: fresh_feed, expr: fresh, refusal: {reason: stale feed, phase: pre}}
    - {id: rate_pos, expr: rate > 0, refusal: {reason: no rate, phase: pre}}
    - {id: unhealthy, expr: 'not health(c, accrued, rate, mcrBps)', refusal: {reason: healthy, phase: pre}}
    - {id: close_factor, expr: amount <= ceil(accrued * closeFactorBps / 10000), refusal: {reason: close factor, phase: pre}}
    - {id: covered, expr: 'payout(amount, bonusBps, rate) <= c or amount * 1e8 >= c * rate', refusal: {reason: underwater repayment, phase: pre}}
    - {id: slippage, expr: seized >= minCollateral, refusal: {reason: slippage, phase: pre}}
    effects:
    - {target: supply, formula: supply - amount}
    - {target: custody.rev, formula: custody.rev - seized}
    - {target: 'vaults[ownerId].collateral', formula: c - seized}
    - {target: 'vaults[ownerId].debt', formula: 0 if writeOff else accrued - amount}
    - {target: 'vaults[ownerId].lastHeight', formula: now}
    - {target: totalCollateral, formula: totalCollateral - seized}
    - {target: totalDebt, formula: totalDebt + (accrued - d) - amount}
    - {target: totalAccruedInterest, formula: totalAccruedInterest + (accrued - d)}
    - {target: badDebt, formula: badDebt + (accrued - amount if writeOff else 0)}
    - {target: sin, formula: sin + (accrued - amount if writeOff else 0) - cancelled}
    - {target: surplus, formula: surplus - cancelled}
    - {target: vaults.rev, formula: rev + 1}
    access:
    - {cell: liquidationAuthState, mode: peek, actor: arm, phase: pre}
    - {cell: provisionedState, mode: peek, actor: arm, phase: pre}
    - {cell: vaultState, mode: peek, actor: arm, phase: pre}
    - {cell: vaultState, mode: consume, actor: 'helper:vaultLiquidateDecide', phase: commit}
    - {cell: vaultState, mode: post, actor: 'helper:vaultLiquidateDecide', phase: commit}
    nested_calls:
    - {callee: vaultParams, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultResolve, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultRate, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultAccrue, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: vaultLiquidateDecide, protocol: H2b, takes: [vaultState], puts: [vaultState], post_owner: helper}
    refusals:
    - {reason: amount, phase: pre, reposts: false, fail: false}
    - {reason: bad liquidation authority, phase: pre, reposts: false, fail: false}
    - {reason: close factor, phase: pre, reposts: false, fail: false}
    - {reason: healthy, phase: pre, reposts: false, fail: false}
    - {reason: no rate, phase: pre, reposts: false, fail: false}
    - {reason: no slot, phase: pre, reposts: false, fail: false}
    - {reason: no vault, phase: pre, reposts: false, fail: false}
    - {reason: not a stablecoin payment, phase: pre, reposts: false, fail: false}
    - {reason: slippage, phase: pre, reposts: false, fail: false}
    - {reason: stale feed, phase: pre, reposts: false, fail: false}
    - {reason: underwater repayment, phase: pre, reposts: false, fail: false}
    invariants:
    - S3
    - S5
    - S6
    - S7
    - S9
    status: verified
    acceptance:
    - AC-SPEC-ISS-01.1
    model: issuer.liquidate
    vector: ledger.liquidate
