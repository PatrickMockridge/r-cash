    - {reason: bad liquidation authority, phase: pre, reposts: false, fail: false}
    - {reason: close factor, phase: pre, reposts: false, fail: false}
    - {reason: healthy, phase: pre, reposts: false, fail: false}
    - {reason: no rate, phase: pre, reposts: false, fail: false}
    - {reason: no vault, phase: pre, reposts: false, fail: false}
    - {reason: not a stablecoin payment, phase: pre, reposts: false, fail: false}
    - {reason: slippage, phase: pre, reposts: false, fail: false}
    - {reason: stale feed, phase: pre, reposts: false, fail: false}
    - {reason: underwater repayment, phase: pre, reposts: false, fail: false}
