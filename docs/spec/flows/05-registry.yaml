    status: verified
    acceptance:
    - AC-SPEC-REG-01.1
  - arm: StablecoinDirectory@"lookup"
    transition: registry.StablecoinDirectory.lookup
    lean: Rholphin.Model.Registry.stablecoinDirectory_lookup
    kind: read
    source: {file: contracts/src/deploy/v3/32_currency_registry.rho, line: 39}
    guards:
