# Flow specification.
# Arm keys, source lines, access modes and refusal sets are checked against
# contracts/build/arm_inventory.json by tools/check_flows.py. Guards, effects,
# acceptance IDs, model/vector and invariants are the authored content; status is
# not a synonym for tested. See README.md for the schema and protocol labels.

schema: rcash.flows/v1
subsystem: registry
source_globs:
- contracts/src/deploy/v3/00_root.rho
- contracts/src/deploy/v3/32_currency_registry.rho
- contracts/src/deploy/v3/14_asset_resolver.rho
invariants: {}
defects:
- {id: D1.1, subject: CurrencyRegistry@"setPaused", defect: peeks currencyState and posts it on the no-currency branch without consuming,
  fix: delete the post on that branch, status: fixed}
components:
- name: Root
  lean_module: Rholphin.Model.Registry
  arms:
  - arm: Root@"resolve"
    transition: registry.Root.resolve
    lean: Rholphin.Model.Registry.root_resolve
    kind: read
    source: {file: contracts/src/deploy/v3/00_root.rho, line: 29}
    guards:
    - {id: exists, expr: 'entries[key] != Nil', refusal: {reason: unknown component, phase: pre}}
    - {id: not_retired, expr: 'entries[key].status != "retired"', refusal: {reason: retired, phase: pre}}
    - {id: version, expr: 'entries[key].version >= minVersion', refusal: {reason: stale, phase: pre}}
    effects:
    - {target: reply, formula: '(true, entries[key].uri, entries[key].version)'}
    access:
    - {cell: rootState, mode: peek, actor: arm, phase: pre}
    nested_calls: []
    refusals:
    - {reason: retired, phase: pre, reposts: false, fail: false}
    - {reason: stale, phase: pre, reposts: false, fail: false}
    - {reason: unknown component, phase: pre, reposts: false, fail: false}
    invariants:
    - I20
    status: verified
    acceptance:
    - AC-SPEC-REG-01.1
  - arm: Root@"get"
    transition: registry.Root.get
    lean: Rholphin.Model.Registry.root_get
    kind: read
    source: {file: contracts/src/deploy/v3/00_root.rho, line: 44}
    guards:
    - {id: exists, expr: 'entries[key] != Nil', refusal: {reason: unknown component, phase: pre}}
    effects:
    - {target: reply, formula: '(true, entries[key])'}
    access:
    - {cell: rootState, mode: peek, actor: arm, phase: pre}
    nested_calls: []
    refusals:
    - {reason: unknown component, phase: pre, reposts: false, fail: false}
    invariants: []
    status: verified
    acceptance:
    - AC-SPEC-REG-01.1
  - arm: Root@"keys"
    transition: registry.Root.keys
    lean: Rholphin.Model.Registry.root_keys
    kind: read
    source: {file: contracts/src/deploy/v3/00_root.rho, line: 53}
    guards: []
    effects:
    - {target: reply, formula: '(true, keys(entries))'}
    access:
    - {cell: rootState, mode: peek, actor: arm, phase: pre}
    nested_calls: []
    refusals: []
    invariants: []
    status: verified
    acceptance:
    - AC-SPEC-REG-01.1
  - arm: Root@"register"
    transition: registry.Root.register
    lean: Rholphin.Model.Registry.root_register
    kind: mutate
    source: {file: contracts/src/deploy/v3/00_root.rho, line: 57}
    guards:
    - {id: unfrozen, expr: not frozen, refusal: {reason: frozen, phase: pre}}
    - {id: installer, expr: pk = installer, refusal: {reason: not installer, phase: pre}}
    - {id: version, expr: version >= 1, refusal: {reason: bad version, phase: pre}}
    - {id: new, expr: 'entries[key] = Nil', refusal: {reason: duplicate, phase: pre}}
    effects:
    - {target: 'entries[key]', formula: '{uri: uri, version: version, kind: kind, status: active}'}
    access:
    - {cell: rootState, mode: consume, actor: arm, phase: commit}
    - {cell: rootState, mode: post, actor: arm, phase: commit}
    nested_calls: []
    refusals:
    - {reason: bad version, phase: pre, reposts: false, fail: false}
    - {reason: duplicate, phase: pre, reposts: false, fail: false}
    - {reason: frozen, phase: pre, reposts: false, fail: false}
    - {reason: not installer, phase: pre, reposts: false, fail: false}
    invariants:
    - I20
    status: verified
    acceptance:
    - AC-SPEC-REG-01.1
  - arm: Root@"rotate"
    transition: registry.Root.rotate
    lean: Rholphin.Model.Registry.root_rotate
    kind: mutate
    source: {file: contracts/src/deploy/v3/00_root.rho, line: 85}
    guards:
    - {id: unfrozen, expr: not frozen, refusal: {reason: frozen, phase: pre}}
    - {id: exists, expr: 'entries[key] != Nil', refusal: {reason: unknown component, phase: pre}}
    - {id: expected, expr: 'entries[key].version = expectedVersion', refusal: {reason: stale, phase: pre}}
    - {id: authorize, expr: 'AdminGuard.verify(root, nonce, rotate, argsHash)', refusal: {reason: below threshold, phase: pre}}
    - {id: nonce, expr: nonce > govNonce, refusal: {reason: replay, phase: pre}}
    - {id: recheck, expr: 'entries[key].version = expectedVersion', refusal: {reason: stale, phase: pre}}
    effects:
    - {target: 'entries[key].uri', formula: newUri}
    - {target: 'entries[key].version', formula: newVersion}
    - {target: 'entries[key].status', formula: active}
    - {target: govNonce, formula: nonce}
    access:
    - {cell: rootState, mode: peek, actor: arm, phase: pre}
    - {cell: rootState, mode: consume, actor: arm, phase: commit}
    - {cell: rootState, mode: post, actor: arm, phase: commit}
    nested_calls:
    - {callee: rootAuthorize, protocol: P0, takes: [], puts: [], post_owner: helper}
    refusals:
    - {reason: frozen, phase: pre, reposts: false, fail: false}
    - {reason: replay, phase: pre, reposts: false, fail: false}
    - {reason: stale, phase: pre, reposts: false, fail: false}
    - {reason: unknown component, phase: pre, reposts: false, fail: false}
    invariants:
    - I19
    - I20
    status: verified
    acceptance:
    - AC-SPEC-REG-01.1
  - arm: Root@"deprecate"
    transition: registry.Root.deprecate
    lean: Rholphin.Model.Registry.root_deprecate
    kind: mutate
    source: {file: contracts/src/deploy/v3/00_root.rho, line: 136}
    guards:
    - {id: unfrozen, expr: not frozen, refusal: {reason: frozen, phase: pre}}
    - {id: authorize, expr: 'AdminGuard.verify(root, nonce, deprecate, key)', refusal: {reason: below threshold, phase: pre}}
    - {id: nonce, expr: nonce > govNonce, refusal: {reason: replay, phase: pre}}
    - {id: exists, expr: 'entries[key] != Nil', refusal: {reason: unknown component, phase: pre}}
    effects:
    - {target: 'entries[key].status', formula: retired}
    - {target: govNonce, formula: nonce}
    access:
    - {cell: rootState, mode: peek, actor: arm, phase: pre}
    - {cell: rootState, mode: consume, actor: arm, phase: commit}
    - {cell: rootState, mode: post, actor: arm, phase: commit}
    nested_calls:
    - {callee: rootAuthorize, protocol: P0, takes: [], puts: [], post_owner: helper}
    refusals:
    - {reason: frozen, phase: pre, reposts: false, fail: false}
    - {reason: replay, phase: pre, reposts: false, fail: false}
    - {reason: unknown component, phase: pre, reposts: false, fail: false}
    invariants:
    - I19
    - I20
    status: verified
    acceptance:
    - AC-SPEC-REG-01.1
  - arm: Root@"freeze"
    transition: registry.Root.freeze
    lean: Rholphin.Model.Registry.root_freeze
    kind: mutate
    source: {file: contracts/src/deploy/v3/00_root.rho, line: 170}
    guards:
    - {id: unfrozen, expr: not frozen, refusal: {reason: frozen, phase: pre}}
    - {id: authorize, expr: 'AdminGuard.verify(root, nonce, freeze, empty)', refusal: {reason: below threshold, phase: pre}}
    - {id: nonce, expr: nonce > govNonce, refusal: {reason: replay, phase: pre}}
    effects:
    - {target: frozen, formula: 'true'}
    - {target: govNonce, formula: nonce}
    access:
    - {cell: rootState, mode: peek, actor: arm, phase: pre}
    - {cell: rootState, mode: consume, actor: arm, phase: commit}
    - {cell: rootState, mode: post, actor: arm, phase: commit}
    nested_calls:
    - {callee: rootAuthorize, protocol: P0, takes: [], puts: [], post_owner: helper}
    refusals:
    - {reason: frozen, phase: pre, reposts: false, fail: false}
    - {reason: replay, phase: pre, reposts: false, fail: false}
    invariants:
    - I19
    - I20
    status: verified
    acceptance:
    - AC-SPEC-REG-01.1
  - arm: Root@"admin"
    transition: registry.Root.admin
    lean: Rholphin.Model.Registry.root_admin
    kind: mutate
    source: {file: contracts/src/deploy/v3/00_root.rho, line: 197}
    guards:
    - {id: unfrozen, expr: not frozen, refusal: {reason: frozen, phase: pre}}
    - {id: authorize, expr: 'AdminGuard.verify(root, nonce, action, args)', refusal: {reason: below threshold, phase: pre}}
    - {id: nonce, expr: nonce > govNonce, refusal: {reason: replay, phase: pre}}
    - {id: threshold, expr: 1 <= newThreshold <= len(newAdmins), refusal: {reason: threshold, phase: pre}}
    effects:
    - {target: admins, formula: newAdmins if action = setAdmins else admins}
    - {target: threshold, formula: newThreshold}
    - {target: govNonce, formula: nonce}
    access:
    - {cell: rootState, mode: peek, actor: arm, phase: pre}
    - {cell: rootState, mode: consume, actor: arm, phase: commit}
    - {cell: rootState, mode: post, actor: arm, phase: commit}
    nested_calls:
    - {callee: rootAuthorize, protocol: P0, takes: [], puts: [], post_owner: helper}
    refusals:
    - {reason: frozen, phase: pre, reposts: false, fail: false}
    - {reason: replay, phase: pre, reposts: false, fail: false}
    - {reason: threshold, phase: pre, reposts: false, fail: false}
    - {reason: unknown admin action, phase: pre, reposts: false, fail: false}
    invariants:
    - I19
    status: verified
    acceptance:
    - AC-SPEC-REG-01.1
  states:
  - Live
  - Frozen
  initial: Live
- name: StablecoinDirectory
  lean_module: Rholphin.Model.Registry
  arms:
  - arm: StablecoinDirectory@"register"
    transition: registry.StablecoinDirectory.register
    lean: Rholphin.Model.Registry.stablecoinDirectory_register
    kind: mutate
    source: {file: contracts/src/deploy/v3/32_currency_registry.rho, line: 19}
    guards:
    - {id: auth, expr: auth = directoryAuth, refusal: {reason: bad directory authority, phase: pre}}
    - {id: new, expr: 'systems[code] = Nil', refusal: {reason: exists, phase: pre}}
    effects:
    - {target: 'systems[code]', formula: entry}
    - {target: rev, formula: rev + 1}
    access:
    - {cell: stablecoinDirectoryState, mode: consume, actor: arm, phase: commit}
    - {cell: stablecoinDirectoryState, mode: post, actor: arm, phase: commit}
    nested_calls: []
    refusals:
    - {reason: bad directory authority, phase: pre, reposts: false, fail: false}
    - {reason: exists, phase: pre, reposts: false, fail: false}
    invariants:
