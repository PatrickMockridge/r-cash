  initial: Live
- name: CurrencyRegistry
  lean_module: Rholphin.Model.Registry
  arms:
  - arm: CurrencyRegistry@"register"
    transition: registry.CurrencyRegistry.register
    lean: Rholphin.Model.Registry.currencyRegistry_register
    kind: mutate
    source: {file: contracts/src/deploy/v3/32_currency_registry.rho, line: 88}
    guards:
    - {id: new, expr: 'currencies[code] = Nil', refusal: {reason: exists, phase: pre}}
    - {id: sponsor_sig, expr: 'Verifier.sigOk(H(rcash:currency-register:v3|...), sig, sponsor)', refusal: {reason: bad sponsor signature,
        phase: pre}}
    - {id: currency, expr: attestation.currency = code, refusal: {reason: currency mismatch, phase: pre}}
    - {id: params, expr: attestation.paramsHash = paramsHash, refusal: {reason: params hash, phase: pre}}
    - {id: sponsor, expr: attestation.sponsor = sponsorHex, refusal: {reason: sponsor mismatch, phase: pre}}
    - {id: directory, expr: StablecoinDirectory.register ok, refusal: {reason: exists, phase: pre}}
    - {id: recheck, expr: 'currencies[code] = Nil', refusal: {reason: exists, phase: pre}}
    effects:
    - {target: 'currencies[code]', formula: entry}
    - {target: 'directory.systems[code]', formula: entry}
    - {target: rev, formula: rev + 1}
    access:
    - {cell: currencyState, mode: peek, actor: arm, phase: pre}
    - {cell: currencyState, mode: consume, actor: arm, phase: commit}
    - {cell: currencyState, mode: post, actor: arm, phase: commit}
    nested_calls: []
    refusals:
    - {reason: bad attestation, phase: pre, reposts: false, fail: false}
    - {reason: bad sponsor signature, phase: pre, reposts: false, fail: false}
    - {reason: currency mismatch, phase: pre, reposts: false, fail: false}
    - {reason: exists, phase: pre, reposts: false, fail: false}
    - {reason: params hash, phase: pre, reposts: false, fail: false}
    - {reason: sponsor mismatch, phase: pre, reposts: false, fail: false}
    invariants:
    - I2
    - S8
    status: verified
    acceptance:
    - AC-SPEC-REG-01.1
  - arm: CurrencyRegistry@"currency"
    transition: registry.CurrencyRegistry.currency
    lean: Rholphin.Model.Registry.currencyRegistry_currency
    kind: read
    source: {file: contracts/src/deploy/v3/32_currency_registry.rho, line: 293}
    guards:
    - {id: exists, expr: 'currencies[code] != Nil', refusal: {reason: no currency, phase: pre}}
    effects:
    - {target: reply, formula: '(true, currencies[code])'}
    access:
    - {cell: currencyState, mode: peek, actor: arm, phase: pre}
    nested_calls: []
    refusals:
    - {reason: no currency, phase: pre, reposts: false, fail: false}
    invariants:
    - I2
    status: verified
    acceptance:
    - AC-SPEC-REG-01.1
  - arm: CurrencyRegistry@"currencies"
    transition: registry.CurrencyRegistry.currencies
    lean: Rholphin.Model.Registry.currencyRegistry_currencies
    kind: read
    source: {file: contracts/src/deploy/v3/32_currency_registry.rho, line: 302}
    guards: []
    effects:
    - {target: reply, formula: '(true, keys(currencies))'}
    access:
    - {cell: currencyState, mode: peek, actor: arm, phase: pre}
    nested_calls: []
    refusals: []
    invariants:
    - I2
    status: verified
    acceptance:
    - AC-SPEC-REG-01.1
  - arm: CurrencyRegistry@"setPaused"
    transition: registry.CurrencyRegistry.setPaused
    lean: Rholphin.Model.Registry.currencyRegistry_setPaused
    kind: mutate
    source: {file: contracts/src/deploy/v3/32_currency_registry.rho, line: 308}
    guards:
    - {id: exists, expr: 'currencies[code] != Nil', refusal: {reason: no currency, phase: pre}}
    - {id: external_pause, expr: 'entry.kind != external implies VaultBook.pause(paused, nonce, sigs) ok', refusal: {reason: authorize,
        phase: pre}}
    - {id: governor_pause, expr: 'entry.kind = external implies Governor.authorize(currency:code, nonce, setPaused, paused.toString())',
      refusal: {reason: below threshold, phase: pre}}
    - {id: recheck, expr: 'currencies[code] != Nil', refusal: {reason: no currency, phase: pre}}
    effects:
    - {target: 'currencies[code].status', formula: 'paused ? paused : active'}
    - {target: rev, formula: rev + 1}
    access:
    - {cell: currencyState, mode: peek, actor: arm, phase: pre}
    - {cell: currencyState, mode: consume, actor: 'helper:registrySetStatus', phase: commit}
    - {cell: currencyState, mode: post, actor: 'helper:registrySetStatus', phase: commit}
    nested_calls:
    - {callee: registryStatus, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: registryGovernor, protocol: P0, takes: [], puts: [], post_owner: helper}
    - {callee: registrySetStatus, protocol: H2b, takes: [currencyState], puts: [currencyState], post_owner: helper}
    refusals:
    - {reason: no currency, phase: pre, reposts: false, fail: false}
    invariants:
    - S12
    - I23
    status: verified
    acceptance:
    - AC-SPEC-GOV-09.1
    model: registry.set_paused
  - arm: CurrencyRegistry@"registerExternal"
    transition: registry.CurrencyRegistry.registerExternal
    lean: Rholphin.Model.Registry.currencyRegistry_registerExternal
    kind: mutate
    source: {file: contracts/src/deploy/v3/32_currency_registry.rho, line: 198}
    guards:
    - {id: new, expr: 'currencies[code] = Nil', refusal: {reason: exists, phase: pre}}
    - {id: sponsor_sig, expr: 'Verifier.sigOk(H(rcash:external-asset-register:v1|code|assetUri|sponsor), sig, sponsor)', refusal: {
        reason: bad sponsor signature, phase: pre}}
    - {id: asset, expr: attestation.asset = code, refusal: {reason: asset mismatch, phase: pre}}
    - {id: kind, expr: attestation.kind = external, refusal: {reason: external kind, phase: pre}}
    - {id: sponsor, expr: attestation.sponsor = sponsorHex, refusal: {reason: sponsor mismatch, phase: pre}}
    - {id: decimals, expr: attestation.decimals = 8, refusal: {reason: external decimals, phase: pre}}
    - {id: attestation, expr: adapter attestation returned, refusal: {reason: external attestation, phase: pre}}
    - {id: recheck, expr: 'currencies[code] = Nil', refusal: {reason: exists, phase: pre}}
    effects:
    - {target: 'currencies[code]', formula: '{kind: external, assetUri: assetUri, decimals: 8, sponsor: sponsorHex, status: active}'}
    - {target: 'directory.systems[code]', formula: 'currencies[code]'}
    - {target: rev, formula: rev + 1}
    access:
    - {cell: currencyState, mode: peek, actor: arm, phase: pre}
    - {cell: currencyState, mode: consume, actor: arm, phase: commit}
    - {cell: currencyState, mode: post, actor: arm, phase: commit}
    nested_calls:
    - {callee: StablecoinDirectory@"register", protocol: P4, takes: [], puts: [], post_owner: helper, internal: true}
    refusals:
    - {reason: bad sponsor signature, phase: pre, reposts: false, fail: false}
    - {reason: asset mismatch, phase: pre, reposts: false, fail: false}
    - {reason: external kind, phase: pre, reposts: false, fail: false}
    - {reason: sponsor mismatch, phase: pre, reposts: false, fail: false}
    - {reason: external decimals, phase: pre, reposts: false, fail: false}
    - {reason: external attestation, phase: pre, reposts: false, fail: false}
    - {reason: exists, phase: pre, reposts: false, fail: false}
    invariants:
    - I2
    - I23
    status: verified
    acceptance:
    - AC-SPEC-REG-11.1
    model: registry.register_external
    vector: registry.external.kind
  states:
  - Live
  initial: Live
