  - arm: StablecoinDirectory@"entries"
    transition: registry.StablecoinDirectory.entries
    lean: Rholphin.Model.Registry.stablecoinDirectory_entries
    kind: read
    source: {file: contracts/src/deploy/v3/32_currency_registry.rho, line: 48}
    guards: []
    effects:
    - {target: reply, formula: '(true, keys(systems))'}
    access:
    - {cell: stablecoinDirectoryState, mode: peek, actor: arm, phase: pre}
    nested_calls: []
    refusals: []
    invariants:
    - I2
    status: verified
    acceptance:
    - AC-SPEC-REG-01.1
  states:
