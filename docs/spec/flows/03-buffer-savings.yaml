# Flow specification.
# Arm keys, source lines, access modes and refusal sets are checked against
# contracts/build/arm_inventory.json by tools/check_flows.py. Guards, effects,
# acceptance IDs, model/vector and invariants are the authored content; status is
# not a synonym for tested. See README.md for the schema and protocol labels.
#
# Multi-term transition: the monolith still supplies these arm keys until it is
# deleted, so `check_flows` reports duplicate/source findings for it. The lines
# below name the T3 term and are the ones that remain valid after deletion.
# The privileged buffer mutations moved from SurplusBuffer to the unpublished
# BufferOperatorFacet; the auth ledger rotates the local per-auth cells.

schema: rcash.flows/v1
subsystem: buffer
source_globs:
- contracts/src/deploy/v3/31_stablecoin.rho
- contracts/src/deploy/v3/31_buffer_savings.rho
invariants: {}
components:
- name: SavingsPool
  lean_module: Rholphin.Model.BufferSavings
  arms:
  - arm: SavingsPool@"deposit"
    transition: buffer.SavingsPool.deposit
    lean: Rholphin.Model.BufferSavings.savingsPool_deposit
    kind: mutate
    source: {file: contracts/src/deploy/v3/31_buffer_savings.rho, line: 82}
    guards:
    - {id: amount_pos, expr: amount > 0, refusal: {reason: amount, phase: pre}}
    - {id: payment_asset, expr: isStablecoinPayment(payment), refusal: {reason: asset, phase: pre}}
    - {id: shares_pos, expr: shares = (amount if totalShares = 0 else floor(amount * totalShares / totalAssets)) > 0, refusal: {reason: shares,
        phase: pre}}
    effects:
    - {target: 'shares[ownerId]', formula: held + shares}
    - {target: totalShares, formula: totalShares + shares}
    - {target: totalAssets, formula: totalAssets + amount}
    access:
    - {cell: savingsState, mode: consume, actor: arm, phase: commit}
    - {cell: savingsState, mode: post, actor: arm, phase: commit}
    nested_calls:
    - {callee: callerOwner, protocol: P0, takes: [], puts: [], post_owner: helper}
    refusals:
    - {reason: amount, phase: pre, reposts: false, fail: false}
    - {reason: asset, phase: pre, reposts: false, fail: false}
    - {reason: shares, phase: pre, reposts: false, fail: false}
    invariants:
    - S10
    status: verified
    from: Empty
    to: Funded
    acceptance:
    - AC-SPEC-BUF-01.1
    model: savings.deposit
  - arm: SavingsPool@"withdraw"
    transition: buffer.SavingsPool.withdraw
    lean: Rholphin.Model.BufferSavings.savingsPool_withdraw
    kind: mutate
    source: {file: contracts/src/deploy/v3/31_buffer_savings.rho, line: 135}
    guards:
    - {id: held, expr: 'shares[ownerId] = held', refusal: {reason: shares, phase: pre}}
    - {id: shares_bounds, expr: 0 < shares <= held and totalShares > 0 and totalAssets > 0, refusal: {reason: shares, phase: pre}}
    - {id: payment_ok, expr: savingsPurse.withdraw ok, refusal: {reason: payment, phase: pre}}
    effects:
    - {target: amount, formula: floor(totalAssets * shares / totalShares)}
    - {target: 'shares[ownerId]', formula: held - shares}
    - {target: totalShares, formula: totalShares - shares}
    - {target: totalAssets, formula: totalAssets - amount}
    access:
    - {cell: savingsState, mode: consume, actor: arm, phase: commit}
    - {cell: savingsState, mode: post, actor: arm, phase: commit}
    nested_calls:
    - {callee: callerOwner, protocol: P0, takes: [], puts: [], post_owner: helper}
    refusals:
    - {reason: payment, phase: pre, reposts: false, fail: false}
    - {reason: shares, phase: pre, reposts: false, fail: false}
    invariants:
    - S10
    status: verified
    from: Funded
    to: Empty
    acceptance:
    - AC-SPEC-BUF-01.1
    model: savings.withdraw
  - arm: SavingsPool@"notify"
    transition: buffer.SavingsPool.notify
    lean: Rholphin.Model.BufferSavings.savingsPool_notify
    kind: mutate
    source: {file: contracts/src/deploy/v3/31_buffer_savings.rho, line: 171}
    guards:
    - {id: auth, expr: auth = savingsNotifyAuth, refusal: {reason: bad savings authority, phase: pre}}
    - {id: payment_asset, expr: isStablecoinPayment(payment), refusal: {reason: asset, phase: pre}}
    effects:
    - {target: totalAssets, formula: totalAssets + amount}
    - {target: rev, formula: rev + 1}
    access:
    - {cell: savingsState, mode: consume, actor: arm, phase: commit}
    - {cell: savingsState, mode: post, actor: arm, phase: commit}
    nested_calls:
    - {callee: savingsNotifyCheck, protocol: P0, takes: [], puts: [], post_owner: helper}
    refusals:
    - {reason: asset, phase: pre, reposts: false, fail: false}
    - {reason: bad savings authority, phase: pre, reposts: false, fail: false}
    - {reason: no shares, phase: pre, reposts: true, fail: false}
    invariants:
    - S10
    status: verified
    to: Funded
    acceptance:
    - AC-SPEC-BUF-01.1
  - arm: SavingsPool@"info"
    transition: buffer.SavingsPool.info
    lean: Rholphin.Model.BufferSavings.savingsPool_info
    kind: read
    source: {file: contracts/src/deploy/v3/31_buffer_savings.rho, line: 211}
    guards: []
    effects:
    - {target: reply, formula: '(true, {totalShares, totalAssets, shareValueE8: floor(totalAssets * 1e8 / totalShares), rev})'}
    access:
    - {cell: savingsState, mode: peek, actor: arm, phase: pre}
    nested_calls: []
    refusals: []
    invariants:
    - S10
    status: verified
    acceptance:
    - AC-SPEC-BUF-01.1
  - arm: SavingsPool@"position"
    transition: buffer.SavingsPool.position
    lean: Rholphin.Model.BufferSavings.savingsPool_position
    kind: read
    source: {file: contracts/src/deploy/v3/31_buffer_savings.rho, line: 228}
    guards: []
    effects:
    - {target: reply, formula: '(true, shares[ownerId])'}
    access:
    - {cell: savingsState, mode: peek, actor: arm, phase: pre}
    nested_calls: []
    refusals: []
    invariants:
    - S10
    status: verified
    acceptance:
    - AC-SPEC-BUF-01.1
  - arm: SavingsPool@"attest"
    transition: buffer.SavingsPool.attest
    lean: Rholphin.Model.BufferSavings.savingsPool_attest
    kind: read
    source: {file: contracts/src/deploy/v3/31_buffer_savings.rho, line: 237}
    guards: []
    effects:
    - {target: reply, formula: '(true, {currency, paramsHash, sponsor, kind: "savings"})'}
    access: []
    nested_calls: []
    refusals: []
    invariants: []
    status: verified
    acceptance:
    - AC-SPEC-BUF-01.1
  states:
  - Empty
  - Funded
  initial: Empty
- name: SurplusBuffer
  lean_module: Rholphin.Model.BufferSavings
