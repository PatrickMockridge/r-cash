- name: BufferOperatorFacet
  lean_module: Rholphin.Model.BufferSavings
  arms:
  - arm: BufferOperatorFacet@"deposit"
    transition: buffer.BufferOperatorFacet.deposit
    lean: Rholphin.Model.BufferSavings.surplusBuffer_deposit
