# Evidence registry for docs/spec/acceptance.yaml.
#
# kind:
#   static   — text/structural or Lean check, runs offline
#   offline  — executable test, mock or pure model, runs offline
#   campaign — final disposable-devnet conformance run
#   platform — native rholo/ERTP/Rholang assumption, only the final campaign
#
# A check ID is a stable reference; its artifact may move as long as this file
# moves with it. check_traceability.py rejects an unknown ID or a missing
# artifact for static/offline checks.

static:spec-check:
  kind: static
  command: "make spec-check"
static:flows:
  kind: static
  command: "python3 tools/check_flows.py --check --strict"
static:inventory:
  kind: static
  command: "python3 tools/rho_inventory.py --check"
static:lean:
  kind: static
  command: "python3 tools/check_lean.py"
static:arch:
  kind: static
  command: "python3 tools/check_arch.py --check"
static:captures:
  kind: static
  command: "python3 tools/check_captures.py --check"
static:measure:
  kind: static
  command: "python3 tools/measure_contracts.py --check"
static:mesh:
  kind: static
  command: "python3 tools/check_mesh.py"
static:vectors:
  kind: static
  command: "python3 tools/check_vectors.py"
static:traceability:
  kind: static
  command: "python3 tools/check_traceability.py --check --strict"
static:languages:
  kind: static
  command: "python3 tools/check_languages.py"

offline:model:
  kind: offline
  artifact: "tests/model"
  command: "python3 -m pytest tests/model -q"
offline:web-test:
  kind: offline
  artifact: "web/src"
  command: "npm --prefix web test"
offline:web-typecheck:
  kind: offline
  artifact: "web/tsconfig.json"
  command: "npm --prefix web run typecheck"
offline:sdk-fixture:
  kind: offline
  artifact: "crates/rcash-sdk/tests"
  command: "cargo test -p rcash-sdk"
offline:cli-fixture:
  kind: offline
  artifact: "crates/rcash-cli/src"
  command: "cargo test -p rcash-cli"
offline:wasm:
  kind: offline
  artifact: "crates/rcash-wasm/src"
  command: "cargo test -p rcash-wasm --features rcash-chain/native"
offline:rust-test:
  kind: offline
  artifact: "crates"
  command: "cargo test --workspace --exclude rcash-wasm"

model:issuer:
  kind: offline
  artifact: "tests/model/test_issuer.py"
model:vault:
  kind: offline
  artifact: "tests/model/test_vault.py"
model:buffer:
  kind: offline
  artifact: "tests/model/test_buffer_savings.py"
model:psm:
  kind: offline
  artifact: "tests/model/test_psm.py"
model:amm:
  kind: offline
  artifact: "tests/model/test_amm.py"
model:market:
  kind: offline
  artifact: "tests/model/test_market.py"
model:mesh:
  kind: offline
  artifact: "tests/model/test_mesh.py"
model:invariants:
  kind: offline
  artifact: "tests/model/test_invariants.py"
model:refusals:
  kind: offline
  artifact: "tests/model/test_refusals.py"
model:vectors:
  kind: offline
  artifact: "tests/model/test_vectors.py"

